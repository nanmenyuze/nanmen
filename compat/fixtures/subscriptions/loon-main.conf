[General]
bypass-tun = 192.168.0.0/16
dns-server = 223.5.5.5,1.1.1.1
real-ip = *.example.com

[Proxy]
Demo-SS = Shadowsocks,ss.example.com,8388,aes-128-gcm,"demo-pass",udp=true
Demo-Trojan = Trojan,trojan.example.com,443,"demo-pass",tls-name=trojan.example.com

[Proxy Group]
Proxy = select,Demo-SS,Demo-Trojan

[Rule]
DOMAIN-SUFFIX,ads.example.com,REJECT
DOMAIN,cdn.example.net,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy

[Rewrite]
response if ${url} ~= /^https:\/\/api\.example\.com\/ad/ then response.body.replace("ad-banner", "")

[Script]
response if ${url} ~= /^https:\/\/api\.example\.com/ then script("response.js")

[Mitm]
hostname = api.example.com,*.example.org
