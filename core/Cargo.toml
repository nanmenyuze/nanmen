[package]
name = "nanmen_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "iface-max-addr-count-4"] }
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
aho-corasick = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
crc32fast = "1"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }
hickory-proto = { version = "0.24", default-features = false }
libc = "0.2"
ipnet = "2"
once_cell = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
flate2 = "1"
httparse = "1"
h2 = "0.4"
http = "1"
bytes = "1"
rquickjs = { version = "0.12.2", features = ["classes", "properties", "array-buffer"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
